services:
  - type: web
    name: mzansi-lineup-api
    runtime: python
    plan: free
    # Must match the Neon database's region — every request makes several
    # sequential DB round trips (see config/settings/base.py's CONN_MAX_AGE
    # comment), so a region mismatch here shows up as *every* DB-touching
    # endpoint being consistently slow (not just a cold-start blip). This
    # field was missing originally, which defaulted the service to Oregon
    # against a Frankfurt database — diagnosed live via a ~3.4s-per-request
    # plateau that didn't improve with connection reuse alone.
    region: frankfurt
    rootDir: backend
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application"
    healthCheckPath: /healthz/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      # Set by hand in the Render dashboard — see README "Deployment".
      - key: DJANGO_ALLOWED_HOSTS
        sync: false
      - key: DATABASE_URL # Neon connection string
        sync: false
      - key: CORS_ALLOWED_ORIGINS # your Vercel frontend URL
        sync: false
      - key: CSRF_TRUSTED_ORIGINS # same, with scheme, e.g. https://foo.vercel.app
        sync: false
      - key: TICKETMASTER_API_KEY
        sync: false
      - key: QUICKET_API_KEY
        sync: false
      - key: SPOTIFY_CLIENT_ID
        sync: false
      - key: SPOTIFY_CLIENT_SECRET
        sync: false
