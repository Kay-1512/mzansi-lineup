services:
  - type: web
    name: mzansi-lineup-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application"
    healthCheckPath: /healthz/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      # Set by hand in the Render dashboard — see README "Deployment".
      - key: DJANGO_ALLOWED_HOSTS
        sync: false
      - key: DATABASE_URL # Neon connection string
        sync: false
      - key: CORS_ALLOWED_ORIGINS # your Vercel frontend URL
        sync: false
      - key: CSRF_TRUSTED_ORIGINS # same, with scheme, e.g. https://foo.vercel.app
        sync: false
      - key: TICKETMASTER_API_KEY
        sync: false
